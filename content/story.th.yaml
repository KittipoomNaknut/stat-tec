# บทพูดทั้งหมดของ STAT_TEC — "CEO 5 นาที" (ต้นฉบับอ่านง่าย: docs/STORY.md)
# ตรวจด้วย app/src/narrative/schema.ts — ผิดรูปแบบ / ตัวแปรที่ไม่มีใครส่งให้ = test fail
#
# บรรทัด (line) เขียนได้ 3 แบบ
#   - "ข้อความ"                         แสดงเสมอ
#   - { text: "...", when: close }      แสดงเมื่อฉากส่ง close = true
#   - { cue: regression-line }          สั่งฉากให้เล่น animation (ไม่มีข้อความ)
#   - { text: "...", cue: ... }         ทั้งสองอย่าง
# {var} = ค่าที่แทนตอนเล่น · **ตัวหนา** = เน้นสีทอง · ≤ 12 คำต่อบรรทัด

meta:
  aiName: "[AI_NAME]"
  locale: th

attract:
  kicker: กาลครั้งหนึ่ง ในภาควิชาอันไกลโพ้น…
  title: STAT WARS
  subtitle: DATA AWAKENS
  # ข้อความเลื่อนหายไปในอวกาศ วนทุก crawlSec วินาที
  crawl:
    - บริษัทกำลังจะล่มสลาย เพราะตัดสินใจด้วยความรู้สึก
    - ข้อมูลนับล้านกำลังรอคอย
    - CEO คนใหม่ ผู้อ่านมันออก…
    - ใช้ร่างกายของท่าน บริหารบริษัทใน 5 นาที
  crawlSec: 26
  prompt: ก้าวเข้ามาในวงแสง เพื่อเริ่มภารกิจ

welcome:
  beats:
    - type: mission
      lines:
        - { text: ตรวจพบ CEO คนใหม่…, cue: scan }
        - ยินดีต้อนรับครับ **CEO {codename}**
        - ผมคือ {aiName} ผู้ช่วย AI ประจำบริษัท
        - วันนี้ท่านต้องตัดสินใจเรื่องใหญ่ 4 เรื่อง
        - ด้วยอาวุธเดียว… **ข้อมูล**
    - type: tutorial
      gesture: dwell
      lines: [ยกแขนออกด้านข้าง แล้วชี้ไปที่ปุ่มนี้ค้างไว้ครับ]
      success: เยี่ยมครับ! ท่านพร้อมแล้ว

chapters:
  - id: data
    scene: a-you-are-data
    title: กำเนิดข้อมูล
    concept: Data Collection
    vars: [numbersCollected]
    beats:
      - type: mission
        lines:
          - ก่อนเริ่มงาน ขอผมสแกนท่านหน่อยนะครับ
          - ลองขยับแขน ขยับตัวไปมาดูครับ
      - type: play
        durationSec: 15
        hints:
          - { afterSec: 4, text: "ทุกจุดบนตัวท่าน คือตัวเลข x, y, z" }
          - {
              afterSec: 9,
              text: "ท่านกำลังส่งข้อมูลเกือบ 3,000 ตัวเลขต่อวินาที",
            }
      - type: reveal
        lines:
          - 15 วินาที ท่านสร้างข้อมูลไป **{numbersCollected}** ตัวเลข
      - type: lesson
        lines:
          - แอปที่ท่านใช้ทุกวัน ก็เก็บข้อมูลแบบนี้
          - ใครอ่านข้อมูลเป็น… คนนั้นได้เปรียบ

  - id: coffee
    scene: c-coffee-pricing
    title: ศึกราคากาแฟ
    concept: Regression
    vars: [price, revenue, optimalPrice, close]
    beats:
      - type: mission
        lines:
          - บริษัทเรามีร้านกาแฟชื่อ **'ดาต้าคาเฟ่'**
          - ตอนนี้ขายแก้วละ 60 บาท
          - ถูกไป กำไรน้อย… แพงไป ลูกค้าหนี
          - ราคาไหนทำเงินได้มากที่สุด?
      - type: tutorial
        gesture: raise
        lines: [ยกมือขึ้น = ขึ้นราคา · ลดมือลง = ลดราคา]
        success: ใช่เลยครับ! ลองหาราคาที่ดีที่สุดดู
      - type: play
        durationSec: 30
        hints:
          - { afterSec: 6, text: ดูลูกค้าที่เดินเข้าร้านสิครับ }
          - { afterSec: 14, text: เส้นสีพีชคือรายได้ที่แต่ละราคาที่ท่านลอง }
          - { afterSec: 22, text: เจอจุดสูงสุดหรือยังครับ? }
      - type: reveal
        lines:
          - ท่านตั้งราคา **฿{price}** — รายได้ **฿{revenue}** / วัน
          - {
              text: "ทุกวันคือ 1 จุด: ราคา (X) กับแก้วที่ขายได้ (Y)",
              cue: data-points,
            }
          - { text: ทีนี้… ให้ AI ลากเส้นทำนายครับ, cue: fit-line }
          - ทุกครั้งที่ลองใหม่ ความผิดพลาดรวม **(SSE)** ลดลง
          - { text: "รายได้ = ราคา × จำนวนแก้ว", cue: revenue-curve }
          - โมเดลแนะนำ **฿{optimalPrice}**
          - { text: ท่านเกือบเท่า AI เลยครับ!, when: close }
          - { text: ข้อมูลเห็นสิ่งที่สัญชาตญาณมองไม่เห็นครับ, when: "!close" }
      - type: lesson
        lines:
          - เส้นนี้เรียกว่า **Demand Curve**
          - "**Regression** = หาเส้นที่พลาดน้อยที่สุด"
          - แอปเรียกรถ ปรับราคาแบบนี้ทุกนาที

  - id: segments
    scene: d-segmentation
    title: สามกลุ่มแห่งลูกค้า
    concept: K-means
    vars: [magnetsLeft, lift]
    beats:
      - type: mission
        lines:
          - ร้านเราดังแล้วครับ! มีลูกค้าประจำ **600 คน**
          - "ทุกจุดคือลูกค้า 1 คน: มาบ่อยแค่ไหน กับจ่ายเท่าไร"
          - แต่งบโฆษณามีจำกัด
          - เราต้องรู้ว่าลูกค้าแต่ละกลุ่มเป็นใคร
      - type: tutorial
        gesture: dwell
        lines: [ชี้ไปกลางฝูงลูกค้า แล้วค้างไว้ = วางแม่เหล็ก]
        success: แม่เหล็กดึงลูกค้าที่ใกล้ที่สุดเข้ามาแล้ว!
      - type: play
        durationSec: 25
        hints:
          - { afterSec: 3, text: "อีก {magnetsLeft} ลูก!" }
          - { afterSec: 12, text: ลองวางแม่เหล็กไว้กลางแต่ละฝูงดูครับ }
      - type: reveal
        lines:
          - { text: ทีนี้ให้ AI ลองบ้าง… เริ่มจากเดาสุ่ม, cue: kmeans-run }
          - "ทุกรอบ: ย้ายแม่เหล็กไปกลางกลุ่ม แล้วจัดกลุ่มใหม่"
          - { text: แต่… ควรแบ่งกี่กลุ่มดี?, cue: elbow }
          - 3 กลุ่ม ตรง **"ข้อศอก"** พอดี — มากกว่านั้นได้ไม่คุ้ม
          - { text: AI แบ่งลูกค้าได้ 3 กลุ่มครับ, cue: clusters }
          - ท่านจะยิงโฆษณาไปที่กลุ่มไหน? ชี้ค้างไว้ครับ
          - { cue: choose-segment }
          - "ผลลัพธ์: ยอดขายเพิ่ม **{lift}%**!"
      - type: lesson
        lines:
          - นี่คือ **K-means Clustering**
          - เครื่องจัดกลุ่มเอง โดยไม่มีใครบอกคำตอบ
          - แอปดูหนัง ฟังเพลง ใช้วิธีนี้แนะนำของให้เรา

  - id: fraud
    scene: f-fraud
    title: จับโกงข้ามกาแล็กซี
    concept: Anomaly Detection
    vars: [caught, wrong, aiSeconds, aiRecall, recall, blocked, nearBest]
    beats:
      - type: mission
        lines:
          - ทุกวินาที มีคนรูดบัตรกับเราเป็นพันครั้ง
          - { text: ด่วนครับ ท่าน CEO! มีคนแอบใช้บัตรลูกค้า!, cue: alert }
          - รายการโกงจะเป็น **ดาวแหลมสีแดง**
      - type: tutorial
        gesture: slap
        lines: [ปัดมือเร็ว ๆ ผ่านดาวสีแดง = ยิงเลเซอร์]
        success: โดนเต็ม ๆ! ระวัง… มาอีกเยอะ
      - type: play
        durationSec: 20
        hints:
          - { afterSec: 6, text: เร็วอีก! }
          - { afterSec: 10, text: ระวัง อย่ายิงโดนลูกค้าดีสีฟ้านะครับ! }
          - { afterSec: 15, text: มันมาเร็วเกินคนแล้ว! }
      - type: reveal
        lines:
          - ยิงโกงได้ **{caught}** · ยิงพลาด {wrong} ราย
          - { text: ทีนี้… ให้ AI ลองบ้างครับ, cue: ai-storm }
          - AI ตรวจ **1,000,000** รายการ ใน **{aiSeconds}** วินาที
          - "ทุกจุดคือ 1 รายการ: ไกลบ้านแค่ไหน กับจ่ายเท่าไร"
          - { text: AI วัดว่าแต่ละจุด ห่างจาก "ปกติ" แค่ไหน, cue: ai-ring }
          - นอกวงคือน่าสงสัย — AI จับโกงได้ **{aiRecall}%**
          - วงเล็กไป ลูกค้าดีโดนบล็อก… วงใหญ่ไป โกงหลุด
          - { text: ท่านเลือกขนาดวงเองครับ ยกมือขยาย ลดมือหด, cue: set-ring }
          - จับโกงได้ **{recall}%** · บล็อกคนดี **{blocked}** คน
          - { text: ความเสียหายใกล้ต่ำสุดแล้ว เก่งมากครับ!, when: nearBest }
          - { text: วงสีเขียวคือจุดที่เสียหายน้อยที่สุดครับ, when: "!nearBest" }
      - type: lesson
        lines:
          - นี่คือ **Anomaly Detection**
          - ธนาคารใช้ AI จับโกงแบบนี้ ตลอด 24 ชั่วโมง
          - Data Scientist คือคนเลือกว่าวงควรใหญ่แค่ไหน

  - id: forecast
    scene: h-forecast
    title: พยากรณ์ 11.11
    concept: Forecasting
    vars: [playerAcc, aiAcc, beatAi]
    beats:
      - type: mission
        lines:
          - เทศกาล **11.11** กำลังจะมาถึงครับ
          - เราต้องสั่งของเข้าโกดังเท่าไหร่ดี?
          - สั่งน้อยไป ของขาด… สั่งเยอะไป เงินจม
          - นี่คือยอดขาย 3 ปีที่ผ่านมาครับ
      - type: tutorial
        gesture: draw
        lines: [ยกมือ แล้วลากเส้นทายยอดขายเดือนหน้า]
      - type: play
        durationSec: 25
        hints:
          - { afterSec: 8, text: สังเกตทุกปีช่วงเดือน 11 สิครับ… }
      - type: reveal
        lines:
          - { text: ท่านทาย…, cue: player-line }
          - { text: AI ทาย…, cue: ai-line }
          - { text: และยอดขายจริงคือ…, cue: actual-line }
          - ท่านแม่นยำ **{playerAcc}%** · AI แม่นยำ **{aiAcc}%**
          - { text: ว้าว! ท่านชนะ AI ครับ!, when: beatAi }
          - { text: AI เห็นรูปแบบซ้ำในข้อมูล 3 ปีครับ, when: "!beatAi" }
      - type: lesson
        lines:
          - นี่คือ **Time-Series Forecasting**
          - บริษัทใช้มันวางแผนสต็อก คน และเงินทุน

report:
  title: ภารกิจสำเร็จ
  lines:
    - รายงานผลงาน **CEO {codename}**
    - { text: "กำไรรวม **฿{totalProfit}**", cue: profit-count }
    - "สไตล์ของท่าน: **{ceoStyle}**"
    - อันดับ **{rank}** จาก {totalPlayers} คนวันนี้
    - ทุกอย่างที่ท่านทำวันนี้…
    - คืองานจริงของ **Data Scientist**
    - { text: อยากทำแบบนี้ได้จริงไหมครับ? สแกนเลย, cue: qr }
    - ขอบคุณครับ ท่าน CEO — ไว้พบกันใหม่

styles:
  analyst:
    label: นักวิเคราะห์
    description: ท่านคิดแบบ Data Scientist ตัวจริง
  risk-taker:
    label: นักเสี่ยง
    description: กล้าได้กล้าเสีย — ข้อมูลจะช่วยให้ท่านเสี่ยงอย่างฉลาด
  intuitive:
    label: สายสัญชาตญาณ
    description: เร็วและเฉียบ — ลองใช้ข้อมูลช่วยยืนยันดูครับ

system:
  paused: ท่าน CEO หายไปไหนครับ? กลับมายืนตรงจุดนี้นะครับ
  tooFar: ขยับเข้ามาอีกนิดครับ ผมมองไม่ค่อยชัด
  otherPerson: ขอโทษครับ ตอนนี้ผมดูแล CEO อยู่ 1 ท่าน
  idle: ลองทำตามเงาข้างจอดูครับ
  reconnecting: กำลังเชื่อมต่อระบบใหม่… รอสักครู่ครับ
  skip: ข้าม

codename:
  animals:
    [
      เสือดาว,
      นกฮูก,
      ปลาโลมา,
      เหยี่ยว,
      หมาป่า,
      สิงโต,
      นากทะเล,
      แมวป่า,
      ม้าลาย,
      เต่าทะเล,
      ช้าง,
      กระทิง,
    ]
  titles:
    [
      สายบุก,
      นักคิด,
      ตาไว,
      ใจเย็น,
      สายลุย,
      หัวไว,
      มือทอง,
      ตาเหยี่ยว,
      สายวางแผน,
      นักสำรวจ,
    ]
