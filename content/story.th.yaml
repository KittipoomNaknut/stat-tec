# บทพูดทั้งหมดของ STAT_TEC — "STAT WARS: Price Wars" (ต้นฉบับอ่านง่าย: docs/STORY.md)
# ตรวจด้วย app/src/narrative/schema.ts — ผิดรูปแบบ / ตัวแปรที่ไม่มีใครส่งให้ = test fail
#
# บรรทัด (line) เขียนได้ 3 แบบ
#   - "ข้อความ"                         แสดงเสมอ
#   - { text: "...", when: close }      แสดงเมื่อฉากส่ง close = true
#   - { cue: regression-line }          สั่งฉากให้เล่น animation (ไม่มีข้อความ)
#   - { text: "...", cue: ... }         ทั้งสองอย่าง
# {var} = ค่าที่แทนตอนเล่น · **ตัวหนา** = เน้นสีทอง · ≤ 12 คำต่อบรรทัด

meta:
  aiName: "[AI_NAME]"
  locale: th

attract:
  kicker: กาลครั้งหนึ่ง ในภาควิชาอันไกลโพ้น…
  title: STAT WARS
  subtitle: PRICE WARS
  # ข้อความเลื่อนหายไปในอวกาศ วนทุก crawlSec วินาที
  crawl:
    - ร้านกาแฟเล็ก ๆ กำลังจะแพ้สงครามราคา
    - วัน 11.11 กำลังมา ลูกค้าจะแน่นร้าน
    - CEO คนใหม่ ผู้อ่านข้อมูลออก…
    - ใช้ร่างกายของท่าน ตั้งราคาให้ชนะใน 5 นาที
  crawlSec: 26
  prompt: ก้าวเข้ามาในวงแสง เพื่อเริ่มภารกิจ

welcome:
  beats:
    - type: mission
      lines:
        - { text: ตรวจพบ CEO คนใหม่…, cue: scan }
        - ยินดีต้อนรับครับ **CEO {codename}**
    - type: tutorial
      gesture: pose
      lines: [ชูสองมือขึ้นเหนือหัว เพื่อเริ่มศึกราคา!]
      success: ลุยกันเลย!

# STAT WARS: Price Wars (docs/STORY.md) — 2 ศึก ≤ 5 นาที · พูดน้อย ใช้ท่าเยอะ (research 025)
chapters:
  - id: coffee
    scene: c-coffee-pricing
    title: ราคาเดียว
    concept: Regression
    vars: [price, revenue, optimalPrice, close, quizRight]
    beats:
      - type: mission
        lines:
          - เปิดร้าน **ดาต้าคาเฟ่** วันแรก!
          - { text: "ขายแก้วละ ฿200 จะมีคนซื้อไหม?", cue: quiz }
          - { text: ถูกต้อง! แพงไป ลูกค้าหนีหมด, when: quizRight }
          - {
              text: ไม่มีใครซื้อเลยครับ! แพงไป ลูกค้าหนีหมด,
              when: "!quizRight",
            }
      - type: tutorial
        gesture: raise
        lines: [ยกมือขึ้น = ขึ้นราคา · ลดมือ = ลดราคา]
        success: หาราคาที่ได้เงินมากที่สุด!
      - type: play
        durationSec: 15
        hints:
          - { afterSec: 5, text: ดูลูกค้าเดินเข้าร้านสิครับ }
          - { afterSec: 10, text: ราคาไหนเส้นรายได้สูงสุด? }
      - type: reveal
        lines:
          - ท่านได้ **฿{revenue}** / วัน ที่ราคา ฿{price}
          - { text: AI ดูข้อมูล 13 วัน แล้วลากเส้น…, cue: data-points }
          - { cue: fit-line }
          - { cue: revenue-curve }
          - AI แนะนำ **฿{optimalPrice}**
          - { text: เกือบเท่า AI เลยครับ!, when: close }
      - type: lesson
        lines:
          - "**Regression** = หาจุดทำเงินสูงสุดจากข้อมูล"

  - id: slash
    scene: p-price-slash
    title: ศึก 11.11
    concept: Dynamic Pricing
    vars: [hits, profit, gain]
    beats:
      - type: mission
        lines:
          - วัน **11.11**! ป้ายราคาจะลอยมาเต็มจอ
      - type: tutorial
        gesture: slap
        lines: [ปัดมือฟันป้าย **สีทอง** · เทากับแดงอย่าฟัน!]
        success: ฉับ! มาอีกเยอะเลย
      - type: play
        durationSec: 20
        hints:
          - { afterSec: 6, text: เร็วอีก! }
          - { afterSec: 10, text: คนแน่นร้าน ราคาทองก็สูงขึ้น! }
      - type: reveal
        lines:
          - ฟันได้ **{hits}** ป้าย · กำไร **฿{profit}**
          - { text: ให้ AI ขายทั้งวันบ้าง… กางแขนเลย!, cue: t-pose }
          - { text: AI เปลี่ยนราคาทุกชั่วโมง ตามคนในร้าน, cue: ai-day }
          - AI ได้มากกว่าราคาเดียว **{gain}%**!
      - type: lesson
        lines:
          - "**Dynamic Pricing** · แอปเรียกรถก็ใช้แบบนี้"

report:
  title: ภารกิจสำเร็จ
  lines:
    - รายงานผลงาน **CEO {codename}**
    - { text: "กำไรรวม **฿{totalProfit}**", cue: profit-count }
    - "สไตล์ของท่าน: **{ceoStyle}**"
    - อันดับ **{rank}** จาก {totalPlayers} คนวันนี้
    - นี่คืองานจริงของ **Data Scientist**!
    - { text: อยากเรียนต่อ? สแกนเลย, cue: qr }
    - ขอบคุณครับ ท่าน CEO!

styles:
  analyst:
    label: นักวิเคราะห์
    description: ท่านคิดแบบ Data Scientist ตัวจริง
  risk-taker:
    label: นักเสี่ยง
    description: กล้าได้กล้าเสีย — ข้อมูลจะช่วยให้ท่านเสี่ยงอย่างฉลาด
  intuitive:
    label: สายสัญชาตญาณ
    description: เร็วและเฉียบ — ลองใช้ข้อมูลช่วยยืนยันดูครับ

system:
  paused: ท่าน CEO หายไปไหนครับ? กลับมายืนตรงจุดนี้นะครับ
  tooFar: ขยับเข้ามาอีกนิดครับ ผมมองไม่ค่อยชัด
  otherPerson: ขอโทษครับ ตอนนี้ผมดูแล CEO อยู่ 1 ท่าน
  idle: ลองทำตามเงาข้างจอดูครับ
  reconnecting: กำลังเชื่อมต่อระบบใหม่… รอสักครู่ครับ
  skip: ข้าม
  pointHint: กางแขนออกข้างตัว แล้วชี้

