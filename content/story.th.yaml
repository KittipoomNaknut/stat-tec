# บทพูดทั้งหมดของ STAT_TEC — "STAT WARS: Price Wars" (ต้นฉบับอ่านง่าย: docs/STORY.md)
# ตรวจด้วย app/src/narrative/schema.ts — ผิดรูปแบบ / ตัวแปรที่ไม่มีใครส่งให้ = test fail
#
# บรรทัด (line) เขียนได้ 3 แบบ
#   - "ข้อความ"                         แสดงเสมอ
#   - { text: "...", when: close }      แสดงเมื่อฉากส่ง close = true
#   - { cue: regression-line }          สั่งฉากให้เล่น animation (ไม่มีข้อความ)
#   - { text: "...", cue: ... }         ทั้งสองอย่าง
# {var} = ค่าที่แทนตอนเล่น · **ตัวหนา** = เน้นสีทอง · ≤ 12 คำต่อบรรทัด

meta:
  aiName: "[AI_NAME]"
  locale: th

attract:
  kicker: กาลครั้งหนึ่ง ในภาควิชาอันไกลโพ้น…
  title: STAT WARS
  subtitle: PRICE WARS
  # ข้อความเลื่อนหายไปในอวกาศ วนทุก crawlSec วินาที
  crawl:
    - ร้านกาแฟเล็ก ๆ กำลังจะแพ้สงครามราคา
    - คู่แข่งตัดราคา ลูกค้าเริ่มหนี
    - CEO คนใหม่ ผู้อ่านข้อมูลออก…
    - ใช้ร่างกายของท่าน ตั้งราคาให้ชนะใน 5 นาที
  crawlSec: 26
  prompt: ก้าวเข้ามาในวงแสง เพื่อเริ่มภารกิจ

welcome:
  beats:
    - type: mission
      lines:
        - { text: ตรวจพบ CEO คนใหม่…, cue: scan }
        - ยินดีต้อนรับครับ **CEO {codename}**
        - ผมคือ {aiName} ผู้ช่วย AI ของดาต้าคาเฟ่
        - วันนี้เราจะสู้ศึกราคา… ด้วย **ข้อมูล**
    - type: tutorial
      gesture: dwell
      lines: [ยกแขนออกด้านข้าง แล้วชี้ไปที่ปุ่มนี้ค้างไว้ครับ]
      success: เยี่ยมครับ! ไปเปิดร้านกัน

# STAT WARS: Price Wars (docs/STORY.md) — 3 ศึก ราคาเดียว → ราคาตามกลุ่ม → ราคาตามเวลา, ≤ 5 นาที
chapters:
  - id: coffee
    scene: c-coffee-pricing
    title: ราคาเดียว
    concept: Regression
    vars: [price, revenue, optimalPrice, close]
    beats:
      - type: mission
        lines:
          - วันแรกของ **ดาต้าคาเฟ่** ขายแก้วละเท่าไหร่ดี?
          - ถูกไป กำไรน้อย… แพงไป ลูกค้าหนี
      - type: tutorial
        gesture: raise
        lines: [ยกมือขึ้น = ขึ้นราคา · ลดมือลง = ลดราคา]
        success: ใช่เลยครับ! ลองหาราคาที่ดีที่สุดดู
      - type: play
        durationSec: 20
        hints:
          - { afterSec: 5, text: ดูลูกค้าที่เดินเข้าร้านสิครับ }
          - { afterSec: 12, text: เจอจุดสูงสุดหรือยังครับ? }
      - type: reveal
        lines:
          - ท่านตั้งราคา **฿{price}** — รายได้ **฿{revenue}** / วัน
          - {
              text: "ทุกวันคือ 1 จุด: ราคา (X) กับแก้วที่ขายได้ (Y)",
              cue: data-points,
            }
          - { text: ทีนี้… ให้ AI ลากเส้นทำนายครับ, cue: fit-line }
          - { text: "รายได้ = ราคา × จำนวนแก้ว", cue: revenue-curve }
          - โมเดลแนะนำ **฿{optimalPrice}**
          - { text: ท่านเกือบเท่า AI เลยครับ!, when: close }
          - { text: ข้อมูลเห็นสิ่งที่สัญชาตญาณมองไม่เห็นครับ, when: "!close" }
      - type: lesson
        lines:
          - เส้นนี้เรียกว่า **Demand Curve**
          - "**Regression** = หาเส้นที่พลาดน้อยที่สุด"

  - id: rival
    scene: r-rival
    title: คู่แข่งบุก
    concept: Clustering
    vars: [gap, kept, chosenBest]
    beats:
      - type: mission
        lines:
          - {
              text: ด่วนครับ! **Empire Coffee** มาเปิดตรงข้ามร้านเรา,
              cue: rival,
            }
          - เขาขายแก้วละ **฿49** ถูกกว่าเรา ฿{gap}
          - { text: ลูกค้าเราเริ่มเดินข้ามถนนไปแล้ว…, cue: drift }
      - type: reveal
        lines:
          - { text: ให้ผมดูข้อมูลลูกค้า 600 คนก่อนครับ, cue: kmeans-run }
          - { text: AI แบ่งลูกค้าได้ 3 กลุ่มครับ, cue: clusters }
          - สายพรีเมียม · ขาประจำ · และ **สายประหยัด**
          - { text: ท่านจะสู้ยังไงครับ? ชี้ค้างไว้, cue: choose-strategy }
          - { cue: outcome }
          - "ผลลัพธ์: เก็บกำไรไว้ได้ **{kept}%** ของเดิม"
          - { text: ถูกต้องครับ! ลดเฉพาะคนที่จะหนี, when: chosenBest }
          - {
              text: ทางที่ดีที่สุดคือ ลดเฉพาะสายประหยัดครับ,
              when: "!chosenBest",
            }
      - type: lesson
        lines:
          - AI จัดกลุ่มเองด้วย **Clustering**
          - แล้วตั้งราคาให้แต่ละกลุ่มไม่เท่ากัน

  - id: slash
    scene: p-price-slash
    title: ศึก 11.11
    concept: Dynamic Pricing
    vars: [hits, profit, aiProfit, flatProfit, gain]
    beats:
      - type: mission
        lines:
          - วัน **11.11** มาแล้ว! ลูกค้าแห่เข้าร้าน
          - ทุกวินาทีต้องเลือกราคาใหม่ ป้ายจะลอยมาเรื่อย ๆ
          - ป้ายเทา = ขาดทุน · ป้ายแดง = แพงจนไม่มีใครซื้อ
      - type: tutorial
        gesture: slap
        lines: [ปัดมือเร็ว ๆ ผ่านป้าย **สีทอง** = ขายราคานี้]
        success: ฉับ! ขายได้แล้ว… มาอีกเยอะเลยครับ
      - type: play
        durationSec: 20
        hints:
          - { afterSec: 5, text: เร็วอีก! }
          - { afterSec: 9, text: คนแน่นร้าน ราคาทองก็สูงขึ้นครับ! }
          - { afterSec: 15, text: ระวังป้ายเทากับป้ายแดงนะครับ! }
      - type: reveal
        lines:
          - ท่านฟันได้ **{hits}** ป้าย · กำไร **฿{profit}**
          - { text: ทีนี้… ให้ AI ขายทั้งวันบ้างครับ, cue: ai-day }
          - AI ปรับราคาทุกชั่วโมง ตามจำนวนลูกค้า
          - AI กำไร **฿{aiProfit}** · ราคาเดียวได้ ฿{flatProfit}
          - มากกว่าเดิม **{gain}%** แค่เปลี่ยนราคาตามเวลา
      - type: lesson
        lines:
          - นี่คือ **Dynamic Pricing**
          - แอปเรียกรถ สายการบิน โรงแรม ใช้แบบนี้ทุกนาที

report:
  title: ภารกิจสำเร็จ
  lines:
    - รายงานผลงาน **CEO {codename}**
    - { text: "กำไรรวม 3 ศึก **฿{totalProfit}**", cue: profit-count }
    - "สไตล์ของท่าน: **{ceoStyle}**"
    - อันดับ **{rank}** จาก {totalPlayers} คนวันนี้
    - ทุกอย่างที่ท่านทำวันนี้…
    - คืองานจริงของ **Data Scientist**
    - { text: อยากทำแบบนี้ได้จริงไหมครับ? สแกนเลย, cue: qr }
    - ขอบคุณครับ ท่าน CEO — ไว้พบกันใหม่

styles:
  analyst:
    label: นักวิเคราะห์
    description: ท่านคิดแบบ Data Scientist ตัวจริง
  risk-taker:
    label: นักเสี่ยง
    description: กล้าได้กล้าเสีย — ข้อมูลจะช่วยให้ท่านเสี่ยงอย่างฉลาด
  intuitive:
    label: สายสัญชาตญาณ
    description: เร็วและเฉียบ — ลองใช้ข้อมูลช่วยยืนยันดูครับ

system:
  paused: ท่าน CEO หายไปไหนครับ? กลับมายืนตรงจุดนี้นะครับ
  tooFar: ขยับเข้ามาอีกนิดครับ ผมมองไม่ค่อยชัด
  otherPerson: ขอโทษครับ ตอนนี้ผมดูแล CEO อยู่ 1 ท่าน
  idle: ลองทำตามเงาข้างจอดูครับ
  reconnecting: กำลังเชื่อมต่อระบบใหม่… รอสักครู่ครับ
  skip: ข้าม

