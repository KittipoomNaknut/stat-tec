[project]
name = "stat-tec-perception"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kittipoom", email = "kittipoomnak02@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "opencv-python==5.0.0.93",
    "websockets==17.2",
]

[project.scripts]
stat-tec-perception = "stat_tec_perception:main"

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu[cuda,cudnn]==1.31.0",
    "rtmlib==0.0.16",
    "tensorrt-cu13==10.16.1.11",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]
